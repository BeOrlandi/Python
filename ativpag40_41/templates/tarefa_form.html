{% extends "base.html" %}
{% block title %}{{ "Editar" if tarefa else "Nova" }} tarefa — TaskFlow{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-primary fw-semibold mb-1">Gerenciamento</p>
                        <h1 class="h3 mb-0">{{ "Editar tarefa" if tarefa else "Nova tarefa" }}</h1>
                    </div>
                    <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left me-1"></i>Voltar</a>
                </div>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="titulo">Título</label>
                        <input class="form-control" id="titulo" name="titulo" maxlength="120" required value="{{ tarefa['titulo'] if tarefa else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="descricao">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="5" maxlength="1000">{{ tarefa['descricao'] if tarefa else '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" id="status" name="status">
                            {% set current = tarefa['status'] if tarefa else 'pendente' %}
                            <option value="pendente" {{ "selected" if current == "pendente" }}>Pendente</option>
                            <option value="andamento" {{ "selected" if current == "andamento" }}>Em andamento</option>
                            <option value="concluida" {{ "selected" if current == "concluida" }}>Concluída</option>
                        </select>
                    </div>

                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-save me-1"></i>
                        {{ "Salvar alterações" if tarefa else "Criar tarefa" }}
                    </button>
                    <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
