{% extends "base.html" %}
{% block title %}Cadastro — TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card shadow-sm auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon"><i class="bi bi-person-plus"></i></div>
                <h1 class="h3 fw-bold mt-3">Criar conta</h1>
                <p class="text-body-secondary mb-0">Comece a organizar suas tarefas.</p>
            </div>
            <form method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input class="form-control" type="text" id="nome" name="nome" maxlength="80" required autocomplete="name">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input class="form-control" type="email" id="email" name="email" maxlength="120" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input class="form-control" type="password" id="senha" name="senha" minlength="6" required autocomplete="new-password">
                    <div class="form-text">Mínimo de 6 caracteres.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmar_senha" class="form-label">Confirmar senha</label>
                    <input class="form-control" type="password" id="confirmar_senha" name="confirmar_senha" minlength="6" required autocomplete="new-password">
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-check me-1"></i>Cadastrar</button>
            </form>
            <p class="text-center mt-4 mb-0">Já possui uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
        </div>
    </div>
</div>
{% endblock %}
