{% extends "base.html" %}
{% block title %}Login — TaskFlow{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="card shadow-sm auth-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon"><i class="bi bi-check2-square"></i></div>
                <h1 class="h3 fw-bold mt-3">Entrar</h1>
                <p class="text-body-secondary mb-0">Acesse seu painel de tarefas.</p>
            </div>
            <form method="post" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input class="form-control" type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input class="form-control" type="password" id="senha" name="senha" required autocomplete="current-password">
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
            </form>
            <p class="text-center mt-4 mb-0">Ainda não possui conta? <a href="{{ url_for('registro') }}">Criar cadastro</a></p>
        </div>
    </div>
</div>
{% endblock %}
